# Her 15 dakikada bir veriyi çeker, data/events.json'u depoya yazar ve siteyi GitHub Pages'te yayınlar.
# Herkese açık (public) depolarda GitHub Actions ve Pages ücretsizdir.
name: Verileri güncelle ve yayınla

on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "harita-bot"
          git config user.email "harita-bot@users.noreply.github.com"
          git add data/events.json data/events.js data/places.js
          git diff --staged --quiet || (git commit -m "Veri güncellemesi" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
