<!doctype html>
<html lang="tr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Canlı Olay Haritası</title>
  <meta name="description" content="Türkiye, Kürdistan ve Orta Doğu'daki gelişmeleri canlı gösteren ücretsiz harita">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="logo"><span class="pulse"></span><span id="brandText"></span></div>
      <span id="today" class="today"></span>
      <nav id="regions" class="regions"></nav>
      <button id="toggleFeed" class="icon-btn mobile-only" aria-label="☰"><i class="ti ti-list"></i></button>
    </header>

    <div class="mapwrap">
      <div id="map"></div>

      <!-- Sürüklenebilir paneller: başlığından tutup taşınır, katlanır; yerleri tarayıcıda hatırlanır. -->
      <section id="infoPanel" class="panel info-panel" hidden>
        <header class="panel-head">
          <i class="ti ti-info-circle"></i><span id="infoTitle"></span>
          <button class="panel-btn" data-act="collapse" aria-label="−"><i class="ti ti-minus"></i></button>
          <button class="panel-btn" data-act="close" aria-label="×"><i class="ti ti-x"></i></button>
        </header>
        <div id="infoBody" class="panel-body"></div>
      </section>

      <section id="layersPanel" class="panel layers-panel" hidden>
        <header class="panel-head">
          <i class="ti ti-stack-2"></i><span id="layersTitle"></span>
          <button class="panel-btn" data-act="collapse" aria-label="−"><i class="ti ti-minus"></i></button>
          <button class="panel-btn" data-act="close" aria-label="×"><i class="ti ti-x"></i></button>
        </header>
        <div class="panel-body">
          <div id="basemaps" class="basemaps"></div>
          <div id="chips" class="layer-list"></div>
          <label class="check"><input id="inView" type="checkbox" checked> <span id="inViewLabel"></span></label>
        </div>
      </section>
    </div>

    <aside id="feed" class="feed">
      <div class="feed-tabs">
        <button class="ftab active" data-panel="" id="tabFeed"><i class="ti ti-news"></i><span></span></button>
        <button class="ftab" data-panel="lang" id="tabLang"><i class="ti ti-language"></i><span></span></button>
        <button class="ftab" data-panel="time" id="tabTime"><i class="ti ti-clock"></i><span></span></button>
        <button class="ftab" data-panel="layers" id="tabLayers"><i class="ti ti-stack-2"></i><span></span></button>
      </div>

      <div id="langPanel" class="feed-panel" hidden>
        <div id="uiLangs" class="seg"></div>
        <label class="row"><span id="newsLangLabel"></span><select id="newsLang"></select></label>
      </div>
      <div id="timePanel" class="feed-panel" hidden>
        <div id="ranges" class="seg"></div>
      </div>

      <div class="feed-search">
        <i class="ti ti-search"></i>
        <input id="search" type="search" autocomplete="off">
      </div>
      <div id="topics" class="topics"></div>
      <div id="status" class="status"></div>
      <ol id="list" class="list"></ol>
    </aside>

    <!-- Son dakika şeridi: fare üzerine gelince durur, habere tıklanınca kaynağı açılır. -->
    <footer class="ticker">
      <span id="tickerLabel" class="ticker-label"></span>
      <div class="ticker-viewport"><div id="tickerTrack" class="ticker-track"></div></div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="i18n.js"></script>
  <script src="data/places.js"></script>
  <script src="app.js"></script>
</body>
</html>
